# Flutter Web(WASM) 배포용 서버 설정.
# Dockerfile 이 /etc/nginx/conf.d/default.conf 로 복사한다.
#
# 수동 배포 시에는 아래 gzip 블록만 기존 서버 설정의 http 블록에 넣으면 된다.
#
# 전제: nginx 1.21.0 이상 (기본 mime.types 에 application/wasm 이 있어야 한다).
#       그 미만이면 .wasm 이 octet-stream 으로 나가 WASM 로딩이 실패한다.
#       올리기 어려우면 http 블록의 include mime.types; 다음 줄에
#       types { application/wasm wasm; } 를 추가할 것.
#       (server 블록 안에 쓰면 매핑 전체를 덮어써서 CSS/JS 가 깨진다)

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    ##
    ## 압축 - 이것만으로 첫 로딩이 약 6.5MB 줄어든다
    ##   main.dart.wasm   2,526K -> 938K
    ##   skwasm.wasm      3,497K -> 1,499K
    ##   NanumGothic 4종  2,728K -> 1,076K
    ##   NOTICES          1,325K -> 103K
    ## webp/png 는 이미 압축돼 있어 대상에서 뺀다.
    ##
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml
        font/otf
        font/ttf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
